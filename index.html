<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<style>
   * {
    margin: 0;
    padding: 0;
    }
    .body {
       max-width: 82%;
        margin: auto;
    }
    .left-top-flipkart-logo {
       background-color: #ffe15f; 
      min-width: 150px;
       margin-top: 10px;
       display: flex;
       align-items: center;
       justify-content: center;
       padding: 8px 0px;
       gap: 5px;
       border-radius: 8px;
    }
    .left-top-header {
        display: flex;
        gap: 20px;
        
    }
    .left-top-travel-logo {
       background-color:rgb(188, 209, 227); 
      min-width: 150px;
       margin-top: 10px;
       display: flex;
       align-items: center;
       justify-content: center;
       padding: 8px 0px;
       gap: 5px;
       border-radius: 8px;
    }
    .right-top-location-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
   
   .right-top-header { 
       margin-top: 10px;
       display: flex;
       align-items: center;
       justify-content: center;
       padding: 12px 80px 12px 0px;
       gap: 10px;
    
   }
   .top-header{
    
    display: flex;
    align-items: center;
    justify-content: space-between;
   }
   .bottom-header { 
    
    display: flex;
    align-items: center;
    justify-content: space-between;
    
    
   }
   
   .searchbar {
    margin-top: 20px;
    margin-left: 15px;
    height: 40px;
    width: 900px;
    border: 2px solid rgb(63, 128, 220);
    border-radius: 10px;
    padding: 0px 0px 0px 25px;
   }

    .left-bottom-header {
        position: relative;


    }

   #search-icon {
    position: absolute;
    margin-left: 10px;
    margin-top: 20px;
    top: 15px;
    left: 10px;
   }
   
   
   .right-bottom-order {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
    cursor: pointer;
   }
   .login-bottom-order {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
   }
   .cart-bottom-order {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
   }
   select {
        padding: 5px;
        border-radius: 1px;
        border: 1px solid rgb(246, 247, 248);
        width: 70px;
        font-size: 16px;
        cursor: pointer;
        }
    ul {
        padding: 15px;
        left: 10px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        box-shadow: 3px 3px 8px gray;
        gap: 4px;
      }

      li {
        padding: 5px 30px;
        width: 70%;
      }

      li:hover {
        background-color: aliceblue;
        cursor: pointer;
      }

      button {
        padding: 5px 20px;
        box-shadow: 5px 5px 5px gray;
      }

      .main-div:hover {
        img {
          transform: rotate(180deg);
          transition-duration: 0.5s;
        }
      }

      .list-item {
        display: none;
      }

      .main-div:hover .list-item {
        display: flex;
      }

      .login {
        display: flex;
        align-items: center;
      }    
   
            
</style>
<body>
    <div class="body">
<header>
    
    
       
<section class="top-header">
    <div class="left-top-header" > 
        <div class="left-top-flipkart-logo">
        <img src="https://rukminim3.flixcart.com/fk-p-flap/52/44/image/d2ecfddf891a3922.png?q=60"  height="25px">
        <img src="https://rukminim3.flixcart.com/fk-p-flap/92/36/image/31f7e3af490c225f.png?q=60"  height="20px">
        </div>
        <div class="left-top-travel-logo">
        <img src=" https://rukminim3.flixcart.com/fk-p-flap/58/44/image/7ab4040af860941d.png?q=60"  height="25px">
        <img src="https://rukminim2.flixcart.com/fk-p-flap/72/36/image/5a9ff48eef96b876.png?q=60"  height="20px">
        </div>
    </div>

    <div class="right-top-header">
        <div class="right-top-location-header">
            <i class="fa-duotone fa-solid fa-location-dot"></i>
           <B><h4> Location not set</h4></B>
           </div>
           <div>
           <B> <h4><a href="#">Select delivery location></a></h4></B>
        </div>

    </div>

</section>
<section class="bottom-header">
    <div class="left-bottom-header">
        <i id="search-icon" class="fa-solid fa-magnifying-glass"></i>
        <input class=" searchbar" placeholder=" search here and brand more"  style="font-size: 18px;">

    </div>
    <div class="right-bottom-order">
        <div class="login-bottom-order" style="font-size: 18px;">
            <i class="fa-solid fa-user" style="font-size: 22px;"></i>
             <div class="main-div">
      <div class="login">
        Login
        <img
          src="./keyboard_arrow_down_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg"
          alt=""
        />
      </div>
      <div class="list-item">
        <ul type="none">
          <li>My Profile</li>
          <li>Flipkart zone</li>
          <li>Order</li>
          <li>Wishlist</li>
          <li>Become a seller</li>
          <li>Notification</li>
        </ul>
      </div>
    </div>
        </div>
        <div class="more-bottom order" style="font-size: 18px;">
            <select name="more">
     <b><option value="all categories">More</option></b> 
      <option value="My profile">Become a Seller</option>
      <option value="Flip kart Zone">Notification setting</option>
      <option value="Order">24 * 7 Customer Care</option>
      <option value="Whitlist">Advertise on Flipkart</option>
      </select>
        </div>
        <div class="cart-bottom-order" style="font-size: 18px;">
            <i class="fa-solid fa-cart-shopping" style="font-size: 22px;"></i>
            Cart
        </div>
    </div>

</section>

</header>
</div>

    
</body>
</html
